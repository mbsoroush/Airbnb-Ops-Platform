[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airbnb-ops"
version = "0.4.0"
description = "Airbnb MLOps platform: ingestion, analytics, orchestration, features, experiment tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "typer",
    "rich",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
]
features = [
    "pyarrow",
]
ml = [
    "scikit-learn==1.5.2",
    "mlflow==2.20.3",
    "sqlalchemy>=2.0,<2.1",
    "matplotlib",
    "pyarrow",
]
dev = [
    "pytest",
    "ruff",
]
dvc = [
    "dvc",
]

[project.scripts]
airbnb-ops = "airbnb_ops.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airbnb_ops = ["sql/*.sql"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a reachable Postgres (set AIRBNB_DB_HOST)"]
