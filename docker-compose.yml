name: airbnb-ops-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airbnb
      POSTGRES_PASSWORD: ${AIRBNB_DB_PASSWORD:-airbnb}
      POSTGRES_DB: airbnb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb -d airbnb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Small pipeline run on the tiny CSVs in data/raw
  airbnb-ops:
    build: .
    command: ["airbnb-ops", "run"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

  # Load a city snapshot into Postgres:  docker compose run --rm ingest
  ingest:
    build: .
    profiles: ["ingest"]
    command: ["airbnb-ops", "ingest", "/app/data/raw/munich"]
    environment:
      AIRBNB_DB_HOST: postgres
      AIRBNB_DB_PORT: "5432"
      AIRBNB_DB_NAME: airbnb
      AIRBNB_DB_USER: airbnb
      AIRBNB_DB_PASSWORD: ${AIRBNB_DB_PASSWORD:-airbnb}
      AIRBNB_PII_SALT: ${AIRBNB_PII_SALT:-airbnb-ops}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  # BI layer. Start with `make bi-up`, then provision once with `make bi-setup`.
  # The app database is a local H2 file in a volume: fine for development, use Postgres
  # for the Metabase application database in production.
  metabase:
    image: metabase/metabase:${METABASE_VERSION:-v0.65.6}
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Orchestration. `make af-up`, then open http://localhost:8080 (user admin, password from .env).
  # `standalone` runs every Airflow component in one container with a SQLite metadata DB and
  # SimpleAuthManager: convenient for development, NOT for production (use the official
  # multi-service compose or Helm chart, Postgres metadata DB and a real auth manager).
  # The DAG connects as the database owner, because only the owner may REFRESH the view.
  airflow:
    image: apache/airflow:${AIRFLOW_VERSION:-3.4.0}-python3.12
    command:
      - bash
      - -c
      - >-
        echo "{\"admin\": \"$${AIRFLOW_ADMIN_PASSWORD}\"}" >
        /opt/airflow/simple_auth_manager_passwords.json && exec airflow standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
      PYTHONPATH: /opt/airflow/src
      AIRFLOW_CONN_AIRBNB_WAREHOUSE: postgres://airbnb:${AIRBNB_DB_PASSWORD:-airbnb}@postgres:5432/airbnb
      AIRFLOW_VAR_AIRBNB_REPORTS_DIR: /opt/airflow/reports/airflow_runs
    volumes:
      - airflow-home:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./reports:/opt/airflow/reports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # Experiment tracking (stage 5). `make mlflow-up`, then open http://localhost:5001.
  # Development setup: SQLite backend, artifacts in a local volume, NO authentication.
  # Artifacts are served through the tracking server (--serve-artifacts), so a client on your
  # machine uploads over HTTP and never writes to a path that only exists in the container.
  # Host port 5001 because macOS uses 5000 for AirPlay Receiver.
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION:-2.20.3}
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --default-artifact-root
      - mlflow-artifacts:/
    ports:
      - "${MLFLOW_HOST_PORT:-5001}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  airflow-home:
  metabase-data:
  mlflow-data:
